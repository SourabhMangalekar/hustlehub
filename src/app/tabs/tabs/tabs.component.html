<ion-tabs *ngIf="isMobile">
  <ion-router-outlet></ion-router-outlet>

  <ion-tab-bar slot="bottom">
    <ion-tab-button tab="home" [routerLink]="['/home']">
      <ion-icon name="home-outline"></ion-icon>
      <ion-label>Home</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="post" [routerLink]="['/post']">
      <ion-icon name="add-circle-outline"></ion-icon>
      <ion-label>Post</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="applications" [routerLink]="['/applications']">
      <ion-icon name="briefcase-outline"></ion-icon>
      <ion-label>Applications</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="chat" [routerLink]="['/chat']">
      <ion-icon name="chatbubbles-outline"></ion-icon>
      <ion-label>Chat</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="profile" [routerLink]="['/profile']">
      <ion-icon name="person-outline"></ion-icon>
      <ion-label>Profile</ion-label>
    </ion-tab-button>
  </ion-tab-bar>
</ion-tabs>

<!-- Desktop layout -->
<div *ngIf="!isMobile">
  <ion-router-outlet></ion-router-outlet>
</div>
