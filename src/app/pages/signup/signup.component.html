<ion-content class="auth-content">
  <div class="auth-container">
    <div class="header-section">
      <h1 class="auth-title">Create Account</h1>
      <p class="auth-subtitle">Join HustleHub and start collaborating</p>
    </div>

    <form [formGroup]="signupForm" (ngSubmit)="onSignup()" class="auth-form">
      <div class="role-selector">
        <ion-segment formControlName="role" mode="ios">
          <ion-segment-button value="demand">
            <ion-label>Find Services</ion-label>
          </ion-segment-button>
          <ion-segment-button value="supply">
            <ion-label>Offer Services</ion-label>
          </ion-segment-button>
        </ion-segment>
      </div>

      <div class="input-group">
        <ion-item lines="none" class="custom-input">
          <ion-icon name="person-outline" slot="start" color="medium"></ion-icon>
          <ion-input type="text" placeholder="Full Name" formControlName="fullName"></ion-input>
        </ion-item>
        <div class="error-msg" *ngIf="signupForm.get('fullName')?.touched && signupForm.get('fullName')?.invalid">
          Name is required.
        </div>
      </div>

      <div class="input-group">
        <ion-item lines="none" class="custom-input">
          <ion-icon name="mail-outline" slot="start" color="medium"></ion-icon>
          <ion-input type="email" placeholder="Email Address" formControlName="email"></ion-input>
        </ion-item>
        <div class="error-msg" *ngIf="signupForm.get('email')?.touched && signupForm.get('email')?.invalid">
          Please enter a valid email.
        </div>
      </div>

      <div class="input-group">
        <ion-item lines="none" class="custom-input">
          <ion-icon name="lock-closed-outline" slot="start" color="medium"></ion-icon>
          <ion-input type="password" placeholder="Password (Min 6 chars)" formControlName="password"></ion-input>
        </ion-item>
        <div class="error-msg" *ngIf="signupForm.get('password')?.touched && signupForm.get('password')?.invalid">
          Password must be at least 6 characters.
        </div>
      </div>

      <ion-button expand="block" type="submit" class="auth-btn" [disabled]="signupForm.invalid || isLoading">
        <span *ngIf="!isLoading">Sign Up</span>
        <ion-spinner *ngIf="isLoading" name="crescent"></ion-spinner>
      </ion-button>
    </form>

    <div class="footer-section">
      <p>Already have an account? <a routerLink="/login" class="highlight-link">Sign In</a></p>
    </div>
  </div>
</ion-content>
