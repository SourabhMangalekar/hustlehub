<ion-content class="auth-content" scroll-y="false">
  <div class="auth-container">
    <div class="header-section">
      <div class="logo-box">
        <ion-icon name="rocket-outline" class="brand-icon"></ion-icon>
      </div>
      <h1 class="auth-title">Welcome Back</h1>
      <p class="auth-subtitle">Sign in to continue to HustleHub</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onLogin()" class="auth-form">
      <div class="input-group">
        <ion-item lines="none" class="custom-input">
          <ion-icon name="mail-outline" slot="start" color="medium"></ion-icon>
          <ion-input type="email" placeholder="Email Address" formControlName="email"></ion-input>
        </ion-item>
        <div class="error-msg" *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.invalid">
          Please enter a valid email.
        </div>
      </div>

      <div class="input-group">
        <ion-item lines="none" class="custom-input">
          <ion-icon name="lock-closed-outline" slot="start" color="medium"></ion-icon>
          <ion-input type="password" placeholder="Password" formControlName="password"></ion-input>
        </ion-item>
        <div class="error-msg" *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid">
          Password must be at least 6 characters.
        </div>
      </div>

      <div class="forgot-wrapper">
        <a class="forgot-link">Forgot Password?</a>
      </div>

      <ion-button expand="block" type="submit" class="auth-btn" [disabled]="loginForm.invalid || isLoading">
        <span *ngIf="!isLoading">Sign In</span>
        <ion-spinner *ngIf="isLoading" name="crescent"></ion-spinner>
      </ion-button>
    </form>

    <div class="footer-section">
      <p>Don't have an account? <a routerLink="/signup" class="highlight-link">Sign Up</a></p>
    </div>
  </div>
</ion-content>
