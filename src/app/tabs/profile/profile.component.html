<ion-content class="profile-content" scroll-y="true">
  <div class="profile-header">
    <div class="cover-photo"></div>
    <div class="avatar-container">
      <ion-avatar class="main-avatar">
        <img src="https://i.pravatar.cc/150?img=68" />
      </ion-avatar>
      <div class="edit-badge">
        <ion-icon name="camera"></ion-icon>
      </div>
    </div>
    
    <div class="user-info">
      <h1 class="user-name">Alex Hustle</h1>
      <p class="user-role">Supply Side • Expert Developer</p>
      
      <div class="stats-row">
        <div class="stat-box">
          <h2>14</h2>
          <p>Completed</p>
        </div>
        <div class="stat-divider"></div>
        <div class="stat-box">
          <h2>4.9</h2>
          <p>Rating</p>
        </div>
        <div class="stat-divider"></div>
        <div class="stat-box">
          <h2>+$5K</h2>
          <p>Earned</p>
        </div>
      </div>
    </div>
  </div>

  <div class="settings-container">
    <h3 class="section-title">Account Settings</h3>
    
    <ion-list lines="none" class="settings-list">
      <ion-item class="setting-item" button>
        <ion-icon name="person-circle-outline" slot="start" color="primary"></ion-icon>
        <ion-label>Edit Profile</ion-label>
        <ion-icon name="chevron-forward" slot="end" color="medium"></ion-icon>
      </ion-item>

      <ion-item class="setting-item" button>
        <ion-icon name="notifications-outline" slot="start" color="warning"></ion-icon>
        <ion-label>Notifications</ion-label>
        <ion-icon name="chevron-forward" slot="end" color="medium"></ion-icon>
      </ion-item>

      <ion-item class="setting-item" button>
        <ion-icon name="card-outline" slot="start" color="success"></ion-icon>
        <ion-label>Payments & Wallet</ion-label>
        <ion-icon name="chevron-forward" slot="end" color="medium"></ion-icon>
      </ion-item>

      <ion-item class="setting-item" button>
        <ion-icon name="shield-checkmark-outline" slot="start" color="tertiary"></ion-icon>
        <ion-label>Privacy & Security</ion-label>
        <ion-icon name="chevron-forward" slot="end" color="medium"></ion-icon>
      </ion-item>
    </ion-list>

    <ion-button expand="block" class="logout-btn" (click)="onLogout()">
      <ion-icon name="log-out-outline" slot="start"></ion-icon>
      Sign Out
    </ion-button>
  </div>
  
  <div class="bottom-spacer"></div>
</ion-content>
