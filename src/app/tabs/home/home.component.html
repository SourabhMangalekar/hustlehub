<ion-header class="ion-no-border">
  <ion-toolbar class="transparent-toolbar" mode="ios">
    <div class="header-content">
      <div class="user-greeting">
        <p class="greeting-text">Hello, Hustler 👋</p>
        <h1 class="header-title">Discover</h1>
      </div>
      <ion-avatar class="header-avatar" routerLink="/tabs/profile">
        <img src="https://i.pravatar.cc/150?img=68" />
      </ion-avatar>
    </div>
  </ion-toolbar>
</ion-header>

<ion-content class="dashboard-content" scroll-y="true">
  <ion-refresher slot="fixed" (ionRefresh)="doRefresh($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  <div class="feed-container">
    
    <!-- Search Bar -->
    <div class="search-wrapper">
      <ion-searchbar mode="ios" placeholder="Search for opportunities..." class="custom-searchbar"></ion-searchbar>
    </div>

    <!-- Category Pills -->
    <div class="categories-scroll">
      <div class="category-pill active">All</div>
      <div class="category-pill">Design</div>
      <div class="category-pill">Development</div>
      <div class="category-pill">Marketing</div>
      <div class="category-pill">Photography</div>
    </div>

    <h2 class="section-heading">Trending Requirements</h2>

    <div class="cards-list">
      
      <div class="loader-state" *ngIf="isLoading()" style="text-align: center; margin-top: 20px;">
        <ion-spinner name="crescent" color="primary"></ion-spinner>
      </div>

      <div class="empty-state" *ngIf="!isLoading() && posts().length === 0" style="text-align: center; color: var(--app-text-secondary); margin-top: 20px;">
        <p>No collaborations found yet!</p>
      </div>

      <!-- Dynamic Cards -->
      <div class="requirement-card" *ngFor="let post of posts()">
        <div class="card-header">
          <ion-badge color="tertiary" class="category-badge">{{ post.city || 'Remote' }}</ion-badge>
        </div>
        <h3 class="card-title">{{ post.title }}</h3>
        <p class="card-desc">{{ post.description }}</p>
        <div class="card-footer">
          <div class="budget">
            <ion-icon name="cash-outline"></ion-icon>
            <span>{{ post.budget }}</span>
          </div>
          <ion-button shape="round" size="small" class="apply-btn">Apply</ion-button>
        </div>
      </div>

    </div>
    
    <div class="bottom-spacer"></div>
  </div>
</ion-content>
